project_spec:
  name: "Web Shooter - Auth & Leaderboard System"
  tech_stack:
    frontend: "PlayCanvas, TypeScript"
    backend: "Supabase (PostgreSQL + Auth)"
    orm: "None (Use @supabase/supabase-js directly)"
  
  core_requirements:
    1. "Anonymous Login": Users are authenticated automatically without email/password.
    2. "Score History": Every game result is recorded in `game_results`.
    3. "Leaderboard View": A view aggregates the User's High Score for ranking.
    4. "Profile Management": Users can update their display name.

backend_implementation:
  instructions: "Execute the following SQL to set up the schema and security policies."
  sql_schema: |
    -- 1. PROFILES: Linked to Supabase Auth
    create table public.profiles (
      id uuid references auth.users not null primary key,
      username text default 'Unknown Pilot',
      updated_at timestamp with time zone default timezone('utc'::text, now())
    );

    -- 2. GAME_RESULTS: History of all plays
    create table public.game_results (
      id bigint generated by default as identity primary key,
      user_id uuid references public.profiles(id) not null,
      score integer not null,
      played_at timestamp with time zone default timezone('utc'::text, now()) not null
    );

    -- 3. TRIGGER: Auto-create profile on signup
    create or replace function public.handle_new_user() 
    returns trigger as $$
    begin
      insert into public.profiles (id, username)
      values (new.id, 'Unknown Pilot');
      return new;
    end;
    $$ language plpgsql security definer;

    create trigger on_auth_user_created
      after insert on auth.users
      for each row execute procedure public.handle_new_user();

    -- 4. VIEW: Leaderboard (High Score Aggregation)
    create view public.leaderboard_view as
      select 
        profiles.username,
        max(game_results.score) as high_score
      from game_results
      join profiles on game_results.user_id = profiles.id
      group by profiles.id, profiles.username
      order by high_score desc;

    -- 5. SECURITY: Row Level Security (RLS)
    alter table public.profiles enable row level security;
    alter table public.game_results enable row level security;

    -- Public Read Access
    create policy "Public profiles are viewable by everyone." on profiles for select using (true);
    create policy "Public scores are viewable by everyone." on game_results for select using (true);
    
    -- Owner Write Access
    create policy "Users can update own profile." on profiles for update using (auth.uid() = id);
    create policy "Users can insert own score." on game_results for insert with check (auth.uid() = user_id);

frontend_implementation:
  
  step_1_setup:
    file: "src/utils/supabaseClient.ts"
    action: "Initialize Supabase client using env vars (VITE_SUPABASE_URL, VITE_SUPABASE_KEY)."
  
  step_2_auth_manager:
    file: "src/managers/AuthManager.ts"
    class: "AuthManager"
    methods:
      - login: "Call supabase.auth.signInAnonymously(). Return user session."
      - updateUsername: "Update 'username' column in 'profiles' table for current user."
      - getCurrentUser: "Return supabase.auth.getUser()."

  step_3_leaderboard_manager:
    file: "src/managers/LeaderboardManager.ts"
    class: "LeaderboardManager"
    methods:
      - submitScore: 
          args: "score: number"
          logic: "Insert { user_id: auth.user.id, score: score } into 'game_results'."
      - fetchRanking:
          args: "limit: number = 10"
          logic: "Select * from 'leaderboard_view' limit 10."

  step_4_integration:
    target: "src/managers/GameManager.ts"
    logic: |
      - On Initialize: Call AuthManager.login().
      - On Game Over: 
          1. Call LeaderboardManager.submitScore(currentScore).
          2. Show Name Input UI.
          3. On Submit Name -> Call AuthManager.updateUsername(newName).
          4. Refresh Leaderboard display.
